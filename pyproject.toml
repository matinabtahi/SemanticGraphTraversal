[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "semantic-graph-traversal"
version = "0.1.0"
description = "Evidence-preserving RDF traversal and analysis for RCOnt and GMOnt"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE", "NOTICE.md"]
authors = [{name = "Matin Abtahi"}]
dependencies = ["rdflib>=7.1,<8", "networkx>=3.2,<4"]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "pyshacl>=0.30,<1", "build>=1,<2"]
embeddings = ["sentence-transformers>=3,<6"]

[project.scripts]
sgt = "sgt.cli:main"

[project.urls]
Repository = "https://github.com/matinabtahi/SemanticGraphTraversal"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
